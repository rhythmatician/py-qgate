[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-qgate"
version = "0.1.0"
description = "Quality gates for CI, pre-commit, and human/agent co-development in Python."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
qgate = "qgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qgate"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "pyright>=1.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
